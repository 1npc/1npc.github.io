- title: Research Interests
  type: nested_list
  contents:
    - title: Computational semantics
      items:
        - Formal meaning representations, in particular Discourse Representation Structures
        - Neural semantic parsing and meaning-to-text generation
        - Semantic generalisation across unseen concepts, linguistic phenomena, languages, and modalities
    - title: Knowledge and reasoning in language models
      items:
        - Benchmarking systematic knowledge coverage and compositional reasoning
        - Symbolic ontologies and retrieval augmentation
        - Reasoning consistency and evidence-driven agent behaviour
    - title: Game AI and AI characters
      items:
        - Character dialogue with persistent memory and stable personality
        - Grounding agent behaviour in explicit world state
        - Controllability and long-horizon behavioural consistency in production settings

- title: Publications
  type: list
  contents:
    - Peer-reviewed work appears at ACL (Findings), ACM Multimedia, IWCS, IJCNN, and in the journals <em>Computational Linguistics</em> and <em>Language Resources and Evaluation</em>. A full, up-to-date list is on the <a href="/publications/">publications page</a>.

